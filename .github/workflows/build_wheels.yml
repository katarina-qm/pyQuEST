name: Build Wheels
on:
  workflow_dispatch:
  push:
    branches: [ cloverleaf-build-wheels ]
jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0 # Check for the latest version
        env:
          CIBW_ARCHS_MACOS: "x86_64 arm64" # Build for both Intel and Apple Silicon on macOS
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
  
